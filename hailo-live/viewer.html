<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Hailo live YOLO11m</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font-family: sans-serif; text-align: center; }
  img { max-width: 100vw; max-height: 90vh; display: block; margin: 0 auto; }
  p { margin: .5rem; font-size: .9rem; }
</style>
</head>
<body>
<img id="frame" alt="live detections">
<p id="status">connecting...</p>
<script>
  // Reload the latest annotated frame as fast as the browser allows.
  const img = document.getElementById("frame");
  const status = document.getElementById("status");
  let frames = 0;
  let last = Date.now();
  function refresh() {
    img.src = "latest.jpg?t=" + Date.now();
  }
  img.onload = function () {
    frames++;
    const now = Date.now();
    if (now - last >= 1000) {
      status.textContent = frames + " fps";
      frames = 0;
      last = now;
    }
    setTimeout(refresh, 50);
  };
  img.onerror = function () {
    status.textContent = "waiting for frames...";
    setTimeout(refresh, 500);
  };
  refresh();
</script>
</body>
</html>
